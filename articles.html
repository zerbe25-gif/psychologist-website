
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FAF8F3">

    <title>Статьи — Сергей Цербе</title>
    <meta name="description" content="Статьи Сергея Цербе о психологическом консультировании.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=20261112-fix2">
</head>

<body class="articles-page">

    <!-- SVG-ФИЛЬТРЫ БУМАГИ -->
    <svg class="paper-svg-filter" aria-hidden="true">

        <filter id="paper-fe-noise">
            <feTurbulence
                id="svg-turb"
                type="fractalNoise"
                baseFrequency="0.035 0.03"
                numOctaves="4"
                stitchTiles="stitch"
                result="noise"
            />
            <feColorMatrix
                id="svg-matrix"
                in="noise"
                type="matrix"
                values="0 0 0 0 0.94
                        0 0 0 0 0.91
                        0 0 0 0 0.85
                        0 0 0 0.35 0"
            />
        </filter>

        <filter id="paper-depth-filter" x="0%" y="0%" width="100%" height="100%">
            <feTurbulence
                id="svg-depth-turb"
                type="fractalNoise"
                baseFrequency="0.045"
                numOctaves="3"
                stitchTiles="stitch"
                result="depthNoise"
            />
            <feDiffuseLighting
                id="svg-depth-light"
                in="depthNoise"
                lighting-color="#ffffff"
                surfaceScale="2"
                diffuseConstant="1"
                result="depthLighting"
            >
                <feDistantLight azimuth="225" elevation="45"/>
            </feDiffuseLighting>
            <feBlend
                in="SourceGraphic"
                in2="depthLighting"
                mode="soft-light"
            />
        </filter>

    </svg>

    <!-- СЛОИ ФАКТУРЫ -->
    <div class="paper-lighting-layer"></div>
    <div id="paper-texture" class="paper-texture-layer"></div>
    <div id="paper-depth" class="paper-depth-layer"></div>

    <!-- ПАНЕЛЬ НАСТРОЕК -->
    <div id="paper-control-panel">

        <button
            class="paper-panel-heading"
            type="button"
            onclick="togglePaperPanel()"
            aria-expanded="false"
        >
            ТЕКСТУРА БУМАГИ
            <span id="paper-panel-arrow">＋</span>
        </button>

        <div id="paper-panel-content" hidden>

            <label>Оттенок бумаги</label>

            <div class="paper-colors">
                <button style="background:#FAF8F3" onclick="setPaperColor('#FAF8F3',this)"></button>
                <button style="background:#F3EFE4" onclick="setPaperColor('#F3EFE4',this)"></button>
                <button style="background:#EBE5D8" onclick="setPaperColor('#EBE5D8',this)"></button>
                <button style="background:#FAFAFA" onclick="setPaperColor('#FAFAFA',this)"></button>
            </div>

            <label for="input-opacity">
                Выраженность:
                <span id="val-opacity">55%</span>
            </label>
            <input id="input-opacity" type="range" min="0.1" max="0.9" step="0.05" value="0.55" oninput="updateOpacity(this.value)">

            <label for="input-grain">
                Размер зерна:
                <span id="val-grain">Среднее</span>
            </label>
            <input id="input-grain" type="range" min="0.015" max="0.08" step="0.005" value="0.035" oninput="updateGrain(this.value)">

            <label for="input-blur">
                Мягкость волокон:
                <span id="val-blur">0.4px</span>
            </label>
            <input id="input-blur" type="range" min="0" max="1.2" step="0.1" value="0.4" oninput="updateBlur(this.value)">

            <label for="input-depth">
                Глубина зерна:
                <span id="val-depth">45%</span>
            </label>
            <input id="input-depth" type="range" min="0" max="1" step="0.05" value="0.45" oninput="updateDepth(this.value)">

            <label for="input-relief">
                Рельеф бумаги:
                <span id="val-relief">35%</span>
            </label>
            <input id="input-relief" type="range" min="0" max="1" step="0.05" value="0.35" oninput="updateRelief(this.value)">

            <label for="input-lighting">
                Глубина освещения:
                <span id="val-lighting">35%</span>
            </label>
            <input id="input-lighting" type="range" min="0" max="1" step="0.05" value="0.35" oninput="updateLighting(this.value)">

        </div>
    </div>

    <!-- ШАПКА -->
    <header class="header">
        <a href="index.html" class="site-name">
            Сергей Цербе
            <span>психологическое консультирование онлайн</span>
        </a>

        <a href="index.html" class="articles-home-link">
            НА ГЛАВНУЮ
        </a>
    </header>

    <!-- СОДЕРЖИМОЕ СТРАНИЦЫ -->
    <main class="articles-content">
        <h1>Статьи</h1>
    </main>

    <script src="script.js?v=20261112-fix2"></script>

</body>
</html>
